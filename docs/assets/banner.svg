<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Flow View</title>
  <desc id="d">Logotipo do Flow View: cards ligados por setas representando o fluxo de uma rota, com um ramo de sucesso e outro de erro.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#94a3b8" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#34d399"/>
    </marker>
    <marker id="er" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#fb7185"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="22" fill="#020617"/>
  <rect width="1200" height="320" rx="22" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="22" fill="none" stroke="#1e293b"/>

  <!-- wordmark -->
  <g transform="translate(64 96)">
    <rect x="0" y="0" width="58" height="58" rx="14" fill="#0b2a36" stroke="url(#glow)" stroke-width="2"/>
    <circle cx="16" cy="16" r="5" fill="#22d3ee"/>
    <path d="M16 21v10q0 6 6 6h10" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <path d="M28 33l7 4-7 4" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(4 -4)"/>
    <text x="78" y="30" font-family="Inter, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif" font-size="46" font-weight="700" fill="#f1f5f9" letter-spacing="-1">Flow View</text>
    <text x="80" y="60" font-family="Inter, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif" font-size="19" fill="#94a3b8">Veja o que uma rota realmente faz — como uma história.</text>
  </g>
  <g transform="translate(64 214)" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace" font-size="14">
    <rect width="176" height="34" rx="17" fill="#0b2a36" stroke="#22d3ee" stroke-opacity="0.6"/>
    <text x="88" y="22" text-anchor="middle" fill="#67e8f9">análise estática</text>
    <rect x="190" width="130" height="34" rx="17" fill="#0b2f24" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="255" y="22" text-anchor="middle" fill="#6ee7b7">zero deps</text>
    <rect x="334" width="204" height="34" rx="17" fill="#3a1f0b" stroke="#fbbf24" stroke-opacity="0.6"/>
    <text x="436" y="22" text-anchor="middle" fill="#fcd34d">segredos removidos</text>
  </g>

  <!-- mini flow -->
  <g font-family="Inter, 'Segoe UI', system-ui, sans-serif" filter="url(#shadow)">
    <!-- entry -->
    <g transform="translate(700 36)">
      <rect width="190" height="64" rx="12" fill="#0f2a3a" stroke="#22d3ee" stroke-opacity="0.65"/>
      <rect width="5" height="64" rx="2.5" fill="#22d3ee"/>
      <rect x="18" y="12" width="26" height="16" rx="4" fill="#22d3ee"/>
      <text x="31" y="24.5" text-anchor="middle" font-size="11" font-weight="700" fill="#06202b">01</text>
      <text x="54" y="25" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#22d3ee">ENTRADA</text>
      <text x="18" y="50" font-size="15" font-weight="650" fill="#f1f5f9">POST /api/orders</text>
    </g>
    <!-- decision -->
    <g transform="translate(700 130)">
      <rect width="190" height="64" rx="12" fill="#3a2a0b" stroke="#fbbf24" stroke-opacity="0.65"/>
      <rect width="5" height="64" rx="2.5" fill="#fbbf24"/>
      <rect x="18" y="12" width="26" height="16" rx="4" fill="#fbbf24"/>
      <text x="31" y="24.5" text-anchor="middle" font-size="11" font-weight="700" fill="#2b1d04">02</text>
      <text x="54" y="25" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#fbbf24">DECISÃO</text>
      <text x="18" y="50" font-size="15" font-weight="650" fill="#f1f5f9">cliente bloqueado?</text>
    </g>
    <!-- success -->
    <g transform="translate(700 232)">
      <rect width="190" height="64" rx="12" fill="#0b2f24" stroke="#34d399" stroke-opacity="0.65"/>
      <rect width="5" height="64" rx="2.5" fill="#34d399"/>
      <rect x="18" y="12" width="26" height="16" rx="4" fill="#34d399"/>
      <text x="31" y="24.5" text-anchor="middle" font-size="11" font-weight="700" fill="#052217">03</text>
      <text x="54" y="25" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#34d399">RESPOSTA</text>
      <text x="18" y="50" font-size="15" font-weight="650" fill="#f1f5f9">201 · Criado</text>
    </g>
    <!-- error -->
    <g transform="translate(990 232)">
      <rect width="190" height="64" rx="12" fill="#3a0f1a" stroke="#fb7185" stroke-opacity="0.65"/>
      <rect width="5" height="64" rx="2.5" fill="#fb7185"/>
      <rect x="18" y="12" width="26" height="16" rx="4" fill="#fb7185"/>
      <text x="31" y="24.5" text-anchor="middle" font-size="11" font-weight="700" fill="#2b0710">04</text>
      <text x="54" y="25" font-size="10.5" font-weight="700" letter-spacing="1.4" fill="#fb7185">RECUSA</text>
      <text x="18" y="50" font-size="15" font-weight="650" fill="#f1f5f9">403 · Proibido</text>
    </g>
  </g>
  <!-- edges -->
  <g fill="none" stroke-width="2.2" stroke-linecap="round">
    <path d="M795 100V128" stroke="#34d399" marker-end="url(#ok)"/>
    <path d="M795 194V230" stroke="#34d399" marker-end="url(#ok)"/>
    <path d="M890 162H1085Q1085 162 1085 178V230" stroke="#fb7185" stroke-dasharray="6 5" marker-end="url(#er)"/>
  </g>
  <g font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">
    <rect x="768" y="206" width="54" height="17" rx="8.5" fill="#020617" stroke="#34d399"/>
    <text x="795" y="218" text-anchor="middle" fill="#34d399">NÃO</text>
    <rect x="958" y="154" width="48" height="17" rx="8.5" fill="#020617" stroke="#fb7185"/>
    <text x="982" y="166" text-anchor="middle" fill="#fb7185">SIM</text>
  </g>
</svg>
